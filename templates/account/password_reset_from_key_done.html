{% extends "base.html" %}

{% block title %}Password updated — The Living Word Library{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto px-6 lg:px-10 py-20 text-center">
  <div class="auth-card text-center">
    <span class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-gold/20 mb-6" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3F5C38" stroke-width="1.5">
        <path d="M5 12l5 5L20 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>

    <p class="eyebrow justify-center mb-3">All set</p>
    <h1 class="text-3xl sm:text-4xl mb-4">Your password has been updated</h1>
    <p class="text-ink-muted leading-relaxed mb-8 max-w-md mx-auto">
      You can now sign in with your new password. Your account and any purchases are untouched.
    </p>

    <a href="{% url 'account_login' %}" class="btn-primary">Sign in</a>
  </div>
</section>
{% endblock %}
