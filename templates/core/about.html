{% extends "base.html" %}
{% block title %}About the Author — The Living Word Library{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto px-6 lg:px-10 py-20">
  <p class="eyebrow mb-4">About</p>
  <h1 class="text-4xl sm:text-5xl mb-10">{{ author.name|default:"About the Author" }}</h1>

  <div class="grid sm:grid-cols-[200px_1fr] gap-10 items-start">
    {% if author.photo %}
      <img src="{{ author.photo.url }}" alt="{{ author.name }}" class="w-full rounded-sm shadow-[0_18px_35px_-15px_rgba(90,27,30,0.35)]">
    {% endif %}
    <div class="prose prose-lg text-ink-muted font-body leading-relaxed">
      {{ author.bio|linebreaks }}
    </div>
  </div>
</section>
{% endblock %}
