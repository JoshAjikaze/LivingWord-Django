{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}John 1:1 Library{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}John 1:1 Library — devotional books rooted in Scripture, written to help you encounter God, not just study Him.{% endblock %}">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col">

  {% include "partials/_nav.html" %}

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/_footer.html" %}

</body>
</html>
