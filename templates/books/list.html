{% extends "base.html" %}
{% block title %}Books — The Living Word Library{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto px-6 lg:px-10 py-16 sm:py-20">
  <div class="mb-10 sm:mb-14">
    <p class="eyebrow mb-3">The collection</p>
    <h1 class="text-4xl font-sans font-extrabold uppercase tracking-[-0.04em] sm:text-5xl">All books</h1>
  </div>

  <div class="grid grid-cols-2 gap-x-4 gap-y-10 sm:grid-cols-3 sm:gap-x-6 sm:gap-y-12 lg:grid-cols-4 lg:gap-x-8 lg:gap-y-14">
    {% for book in books %}
      {% include "books/_book_card.html" with book=book %}
    {% empty %}
      <p class="text-ink-muted col-span-full">No books published yet — check back soon.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
